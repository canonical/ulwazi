name: Run slow tests

on:
  schedule:
    # 03:00 UTC on the 1st of every month.
    - cron: "0 3 3 * *"
  workflow_dispatch:

jobs:
  test-slow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history is required: setuptools_scm derives the version
          # from git tags, and sphinx_last_updated_by_git reads commit times.
          fetch-depth: 0

      - name: Install PDF dependencies
        run: make docs-pdf-prep-force

      - name: Build SCSS
        run: make vanilla-main

      - name: Run slow tests
        run: make test-slow
