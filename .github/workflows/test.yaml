name: Run make test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history is required: setuptools_scm derives the version
          # from git tags, and sphinx_last_updated_by_git reads commit times.
          fetch-depth: 0

      - name: Build SCSS
        run: make vanilla-main

      - name: Run fast tests
        run: make test
