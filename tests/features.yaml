# Features test coverage manifest.
#
# Curated catalog, NOT an automatic inventory of all Sphinx/cheatsheet features.
# A feature counts only when ALL its listed checks pass; each grouped test
# must actually assert this specific behavior. Unimplemented checks use
# `checks: []` so they stay visible in the denominator. The source field
# identifies the sample content or implementation exercised by the check.
# Extend this list when adding a feature or a regression check.

markup:
  - name: Admonitions
    source: myst-cheat-sheet.md / rst-cheat-sheet.rst "Admonitions"; test6_admonitions.rst; test7_admonitionsMD.md
    checks:
      - tests/test_features.py::test_features_fast
  - name: Highlighted code blocks and copy script wiring
    source: cheatsheets "Code blocks"; copybutton.js script tag
    checks:
      - tests/test_features.py::test_features_fast
  - name: H1-H3 headings with inline code
    source: docs/content/test-code-headings.md (heading classes and preserved code)
    checks:
      - tests/test_features.py::test_features_fast
  - name: Local TOC markup and configured depth
    source: docs/content/myst-cheat-sheet.md and rst-cheat-sheet.rst (H4 included; H5 excluded)
    checks:
      - tests/test_features.py::test_features_fast
  - name: Tab markup, selection and keyboard navigation
    source: docs/content/myst-cheat-sheet.md and rst-cheat-sheet.rst (markup); MyST browser tab journey
    checks:
      - tests/test_features.py::test_features_fast
      - tests/test_features.py::test_features_slow
  - name: Unordered body-list classes
    source: docs/content/myst-cheat-sheet.md and rst-cheat-sheet.rst (one unordered list each)
    checks:
      - tests/test_features.py::test_features_fast
  - name: Search breadcrumbs map
    source: search page; test-code-headings.md ancestor
    checks:
      - tests/test_features.py::test_features_fast
  - name: Plain inline code in both cheat sheets
    source: docs/content/myst-cheat-sheet.md and rst-cheat-sheet.rst (inline-formatting section)
    checks:
      - tests/test_features.py::test_features_fast
  - name: Copy button interaction
    source: docs/content/myst-cheat-sheet.md YAML block (Chromium button, target, and copied text)
    checks:
      - tests/test_features.py::test_features_slow
  - name: Tab synchronization across sets
    source: myst-cheat-sheet.md synced tab sets
    checks: []
  - name: Typography design tokens
    source: typography-verification.rst paragraphs, headings and blockquotes
    checks: []
  - name: Sample grid/list/CSV table headers and first rows
    source: docs/content/myst-cheat-sheet.md and rst-cheat-sheet.rst (grid, list and CSV header and first row)
    checks:
      - tests/test_features.py::test_features_fast
  - name: Structured-TOC separator colour and visited-link styling
    source: myst-cheat-sheet.md and rst-cheat-sheet.rst "Structured tables of contents" (markup); light/dark separator colour and visited-link override in Chromium
    checks:
      - tests/test_structured_toc.py::test_structured_toc_markup
      - tests/test_structured_toc.py::test_structured_toc_styling_slow

site:
  - name: Banner project link uses the product website or documentation root
    source: header.html; temporary Sphinx site with root_doc=guide/home (root, nested, genindex and 404 pages; unset, empty and configured product_page; html and dirhtml)
    checks:
      - tests/test_features.py::test_banner_project_link[unset-html]
      - tests/test_features.py::test_banner_project_link[unset-dirhtml]
      - tests/test_features.py::test_banner_project_link[empty-html]
      - tests/test_features.py::test_banner_project_link[empty-dirhtml]
      - tests/test_features.py::test_banner_project_link[configured-html]
      - tests/test_features.py::test_banner_project_link[configured-dirhtml]
  - name: Home page shell
    source: docs/index.md
    checks:
      - tests/test_smoke.py::test_smoke_fast
  - name: Global navigation expander
    source: side navigation drawer browser interaction
    checks:
      - tests/test_features.py::test_features_slow
  - name: Side navigation drawer opens and closes on small screens
    source: hamburger menu browser interaction at tablet width
    checks:
      - tests/test_features.py::test_features_slow
  - name: Get help panel below the Global ToC
    source: docs/conf.py help_links (title, Discourse and issue-tracker links); markup in test_features_fast, keyboard reachability in the drawer journey
    checks:
      - tests/test_features.py::test_features_fast
      - tests/test_features.py::test_features_slow
      - tests/test_config_robustness.py::test_config_robustness
      - tests/test_config_robustness.py::test_help_links_invalid_config[help_links0-'links']
      - tests/test_config_robustness.py::test_help_links_theme_only_loading
  - name: Sampled local assets and control wiring
    source: representative built pages (home, both cheat sheets, code headings, search)
    checks:
      - tests/test_assets_structure.py::test_assets_structure_fast
  - name: SEO and metadata on three sample pages
    source: docs/_build index, contribute and tests/seo-metadata pages
    checks:
      - tests/test_seo_metadata.py::test_seo_metadata
  - name: WCAG AA colour contrast in light and dark themes
    source: docs/content/myst-cheat-sheet.md axe-core color-contrast scan in Chromium
    checks:
      - tests/test_accessibility.py::test_color_contrast_meets_wcag_aa
  - name: SCSS propagation
    source: docs/index.md heading-test-scss fixture (markup and computed colour)
    checks:
      - tests/test_scss_propagation.py::test_scss_styles_propagation
      - tests/test_scss_propagation.py::test_rendered_color
  - name: Cookie consent
    source: Canonical cookie bundle integration
    checks:
      - tests/test_features.py::test_features_slow
  - name: Dark-mode toggle and persistence
    source: theme-toggle.js browser journey across two pages
    checks:
      - tests/test_features.py::test_features_slow
  - name: Search result and breadcrumb navigation
    source: search page, one queried result and its breadcrumb in Chromium
    checks:
      - tests/test_features.py::test_features_slow
  - name: Styled 404 page
    source: generated sample-site 404 page (Ulwazi header/footer, message, penguin image and bundled asset)
    checks:
      - tests/test_notfound_bundling.py::test_built_404_page
  - name: Structured-TOC styling opt-out and separator colour overrides
    source: ulwazi_structured_toc_styling and _separator_color_light/_dark conf.py values
    checks:
      - tests/test_structured_toc.py::test_structured_toc_styling_config
  - name: MyST compatibility defaults and explicit-setting precedence
    source: temporary Sphinx site with myst_parser registered (unset, explicit empty/custom/singleton, and override myst_enable_extensions; both extension orders)
    checks:
      - tests/test_config_robustness.py::test_myst_defaults_restored[ulwazi-first]
      - tests/test_config_robustness.py::test_myst_defaults_restored[myst-first]
      - tests/test_config_robustness.py::test_myst_explicit_extensions_preserved[empty-list]
      - tests/test_config_robustness.py::test_myst_explicit_extensions_preserved[custom-list]
      - tests/test_config_robustness.py::test_myst_explicit_extensions_preserved[singleton-deflist]
      - tests/test_config_robustness.py::test_myst_overrides_take_precedence[override-only-empty]
      - tests/test_config_robustness.py::test_myst_overrides_take_precedence[override-vs-file]
